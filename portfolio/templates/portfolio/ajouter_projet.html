{% load static %}
<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ajouter un Projet</title>
        <link rel="stylesheet" 
            href="{% static 'portfolio/css/style.css' %}">
    </head>
    
 <body>

    <div class="form-page">
        <div class="form-container">

            <h1>Ajouter un projet</h1>

            <form method="post">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit">
                    Enregistrer le projet
                </button>
            </form>

            <a href="{% url 'acceuil' %}">
                Retour à l'accueil
            </a>

        </div>
    </div>
 </body>
</html>
